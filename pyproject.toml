[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gpuops"
version = "0.2.0"
description = "GPU monitoring, job orchestration, and Agent task runtime for research workstations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "OHHHHHHei" }]
dependencies = [
  "pydantic>=2.8,<3",
]

[project.urls]
Repository = "https://github.com/OHHHHHHei/GPUOps"
Issues = "https://github.com/OHHHHHHei/GPUOps/issues"

[project.scripts]
gpuops = "gpuops.cli:main"

[project.optional-dependencies]
web = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "uvicorn>=0.30,<1",
]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gpuops"]

[tool.hatch.build.targets.wheel.force-include]
"pyproject.toml" = "gpuops/_bundled/project/pyproject.toml"
"README.md" = "gpuops/_bundled/project/README.md"
"LICENSE" = "gpuops/_bundled/project/LICENSE"
"skills/gpu-infra/SKILL.md" = "gpuops/_bundled/agent/SKILL.md"
"docs/AGENT_GUIDE.md" = "gpuops/_bundled/agent/docs/AGENT_GUIDE.md"
"docs/CLI_CONTRACT.md" = "gpuops/_bundled/agent/docs/CLI_CONTRACT.md"
"docs/PROGRESS.md" = "gpuops/_bundled/agent/docs/PROGRESS.md"
"examples/job.example.json" = "gpuops/_bundled/agent/examples/job.example.json"
"examples/progress.example.py" = "gpuops/_bundled/agent/examples/progress.example.py"

[tool.hatch.build.targets.sdist]
exclude = ["/docs/acceptance", "/docs/deployment-notes.md"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
